version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgresql+asyncpg://crm_user:crm_password@db:5432/crm
      TIMEZONE: Europe/Kyiv
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS}
      WORK_START_HOUR: 9
      WORK_END_HOUR: 18
      SLOT_STEP_MINUTES: 30
      SCHEDULER_POLL_SECONDS: 300
    restart: unless-stopped

volumes:
  postgres_data:
